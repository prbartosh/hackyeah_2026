# Limity czatu (zadanie 0006): plik jest dołączany w kontekście http.
limit_req_zone $binary_remote_addr zone=chat_req:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

# Publiczne formularze (zgłoszenia, Kreator, oceny): limit tylko dla POST, autozapis (PUT) bez limitu.
map $request_method $form_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $form_limit_key zone=form_req:10m rate=20r/m;

# Zapis bez konta w `/items` (POST, PATCH, DELETE) i zgadywanie tokenu panelu (`/admin/`).
map $request_method $write_limit_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=write_req:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_req:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Czat wywołuje płatny model: limit zapytań i równoległych strumieni na IP.
    location = /api/v1/chat {
        limit_req zone=chat_req burst=5 nodelay;
        limit_req_status 429;
        limit_conn chat_conn 2;
        limit_conn_status 429;
        client_max_body_size 64k;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Karta usługi (zadanie 0012) i prosty język (0035) też wołają płatny model: wspólny limit z czatem.
    location ~ ^/api/v1/innovations/[^/]+/(service-card|prosty-jezyk)$ {
        limit_req zone=chat_req burst=5 nodelay;
        limit_req_status 429;
        limit_conn chat_conn 2;
        limit_conn_status 429;
        client_max_body_size 64k;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Formularze bez konta: zgłoszenie potrzeby, Kreator pomysłów, oceny i testy innowacji,
    # ogłoszenia i wiadomości Giełdy partnerstw (GET listy bez limitu dzięki mapie dla POST).
    location ~ ^/api/v1/(zgloszenia$|kreator/|innovations/[^/]+/opinie$|partnerstwa(/[0-9]+/kontakt|/rozmowy/[^/]+/wiadomosci)?$) {
        limit_req zone=form_req burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Zapis w `/items` jest publiczny: limit dla wszystkich metod zapisu, odczyt bez limitu.
    location ~ ^/api/v1/items {
        limit_req zone=write_req burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel: limit na IP utrudnia zgadywanie tokenu. Wartość z zapasem na zwykłą pracę w panelu.
    location ^~ /api/v1/admin/ {
        limit_req zone=admin_req burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 12m;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API -> backend (same origin, no CORS needed)
    location /api/ {
        proxy_pass http://backend:8000;
        # Czat to strumień SSE: bez buforowania, z zapasem na kilka wywołań modelu w jednej turze
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
